# One small server for JARVIS: his mind (Qwen3.5 2B on llama.cpp), his voice (Kokoro, Sterling) and HTTPS.
# Needs about 3 GB of RAM and 2 to 4 CPU cores. Fill in .env (see .env.example), then: docker compose up -d
services:
  mind:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -hf unsloth/Qwen3.5-2B-GGUF:Q4_K_M
      --host 0.0.0.0 --port 8080 -c 4096 --jinja
      --threads ${MIND_THREADS:-3}
    volumes:
      - models:/root/.cache
    restart: unless-stopped

  voice:
    build: .
    environment:
      JARVIS_SERVER_KEY: ${JARVIS_SERVER_KEY:?set JARVIS_SERVER_KEY in .env}
      LLM_URL: http://mind:8080
      KOKORO_DTYPE: fp32
    volumes:
      - kokoro:/cache
    depends_on: [mind]
    restart: unless-stopped

  https:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [voice]
    restart: unless-stopped

volumes:
  models:
  kokoro:
  caddy:
